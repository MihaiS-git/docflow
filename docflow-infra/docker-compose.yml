services:
  nginx:
    image: nginx:1.27-alpine
    container_name: docflow-nginx
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8085:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - default

  backend:
    image: docflow-backend:dev
    container_name: docflow-backend
    build:
      context: ../docflow-backend
    depends_on:
      keycloak:
        condition: service_started
      docflow-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://docflow-db:5432/${DOCFLOW_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DOCFLOW_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DOCFLOW_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"

      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

      # Browser-facing (via nginx)
      KEYCLOAK_AUTH_URI: ${KEYCLOAK_AUTH_URI}
      KEYCLOAK_LOGOUT_URI: ${KEYCLOAK_LOGOUT_URI}

      # Internal (container → container)
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}

      DOCFLOW_POST_LOGOUT_REDIRECT: ${FRONTEND_BASE_URL}
      DOCFLOW_ALLOWED_ORIGINS: ${FRONTEND_BASE_URL}

      # --- Keycloak Admin Events ---
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL}
      KEYCLOAK_REALM: docflow
      KEYCLOAK_ADMIN_CLIENT_ID: docflow-admin-events
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_ADMIN_POLL_DELAY_MS: 5000
      KEYCLOAK_ADMIN_PAGE_SIZE: 100

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  docflow-db:
    image: postgres:16-alpine
    container_name: docflow-db
    environment:
      POSTGRES_DB: ${DOCFLOW_DB_NAME}
      POSTGRES_USER: ${DOCFLOW_DB_USER}
      POSTGRES_PASSWORD: ${DOCFLOW_DB_PASSWORD}
    volumes:
      - docflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCFLOW_DB_USER} -d ${DOCFLOW_DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "5433:5432"

  keycloak-db:
    image: postgres:16-alpine
    container_name: docflow-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME} -d ${KEYCLOAK_DB_NAME}"]
      interval: 10s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    container_name: docflow-keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: true
      KC_HTTP_ENABLED: true

      # Use hostname v2 option (can be full URL incl. port)
      KC_HOSTNAME: http://localhost:8085
      KC_HOSTNAME_ADMIN: http://localhost:8085
    ports: [] # keep Keycloak internal; access only via nginx
    volumes:
      - ./keycloak/realm-docflow.json:/opt/keycloak/data/import/realm-docflow.json:ro

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: docflow-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: docflow-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

volumes:
  docflow-db-data:
  grafana-data:
  keycloak-db-data:
