secrets:
  soc_password:
    file: ./secrets/soc_password.txt
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: docflow-nginx
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8085:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - edge_net
  
  frontend:
    container_name: docflow-frontend
    build:
      context: ../docflow-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - edge_net

  backend:
    image: docflow-backend:dev
    container_name: docflow-backend
    build:
      context: ../docflow-backend
    depends_on:
      keycloak:
        condition: service_started
      docflow-db:
        condition: service_healthy
    environment:
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://docflow-db:5432/${DOCFLOW_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DOCFLOW_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DOCFLOW_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"

      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

      # Browser-facing (via nginx)
      KEYCLOAK_AUTH_URI: ${KEYCLOAK_AUTH_URI}
      KEYCLOAK_LOGOUT_URI: ${KEYCLOAK_LOGOUT_URI}

      # Internal (container → container)
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}

      DOCFLOW_POST_LOGOUT_REDIRECT: ${FRONTEND_BASE_URL}
      DOCFLOW_ALLOWED_ORIGINS: ${FRONTEND_BASE_URL}

      # --- Keycloak Admin Events ---
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_ADMIN_POLL_DELAY_MS: ${KEYCLOAK_ADMIN_POLL_DELAY_MS}
      KEYCLOAK_ADMIN_PAGE_SIZE: ${KEYCLOAK_ADMIN_PAGE_SIZE}

      KC_HOSTNAME: ${KC_HOSTNAME}

      # --- Email ---
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}

      # --- Admin ---
      DOCFLOW_BOOTSTRAP_ADMIN_EMAIL: ${DOCFLOW_BOOTSTRAP_ADMIN_EMAIL}
      DOCFLOW_BOOTSTRAP_ADMIN_FIRST_NAME: ${DOCFLOW_BOOTSTRAP_ADMIN_FIRST_NAME}
      DOCFLOW_BOOTSTRAP_ADMIN_LAST_NAME: ${DOCFLOW_BOOTSTRAP_ADMIN_LAST_NAME}
    networks:
      - edge_net
      - app_net
      - obs_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  docflow-db:
    image: postgres:16-alpine
    container_name: docflow-db
    environment:
      POSTGRES_DB: ${DOCFLOW_DB_NAME}
      POSTGRES_USER: ${DOCFLOW_DB_USER}
      POSTGRES_PASSWORD: ${DOCFLOW_DB_PASSWORD}
    volumes:
      - docflow-db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    secrets:
      - soc_password
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCFLOW_DB_USER} -d ${DOCFLOW_DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5

  db-audit-grants:
    image: postgres:16-alpine
    container_name: docflow-db-audit-grants
    depends_on:
      docflow-db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${DOCFLOW_DB_NAME}
      POSTGRES_USER: ${DOCFLOW_DB_USER}
      PGPASSWORD: ${DOCFLOW_DB_PASSWORD}
    networks:
      - app_net
    volumes:
      - ./postgres/scripts/apply-audit-grants.sh:/apply-audit-grants.sh:ro
    entrypoint: ["/bin/sh", "/apply-audit-grants.sh"]
    restart: "no"

  keycloak-db:
    image: postgres:16-alpine
    container_name: docflow-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - idp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME} -d ${KEYCLOAK_DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5

  keycloak:
    container_name: docflow-keycloak
    image: quay.io/keycloak/keycloak:26.5.0
    depends_on:
      keycloak-db:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: true
      KC_HTTP_ENABLED: true

      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME}
      KC_LOG_LEVEL: DEBUG

    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - idp_net
      - edge_net
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  keycloak-init:
    image: curlimages/curl:8.10.1
    container_name: docflow-keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    networks:
      - idp_net
    volumes:
      - ./keycloak/kc-init.sh:/kc-init.sh:ro
    entrypoint: ["/bin/sh", "/kc-init.sh"]
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: docflow-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - obs_net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: docflow-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - obs_net

volumes:
  docflow-db-data:
  grafana-data:
  keycloak-db-data:
  pgadmin-data:

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
  idp_net:
    driver: bridge
  obs_net:
    driver: bridge