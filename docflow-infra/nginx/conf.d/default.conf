upstream frontend {
  server docflow-frontend:3000;
}

upstream backend {
  server docflow-backend:8080;
}

upstream keycloak {
  server docflow-keycloak:8080;
}

server {
  listen 80;
  absolute_redirect off;
  proxy_redirect off;

  # ----------------------------
  # HSTS (REAL PROD ONLY)
  # ----------------------------
  # ADDED: HSTS must be owned by NGINX when TLS is terminated here.
  # ENABLE ONLY when:
  # - real HTTPS
  # - public domain
  # - stable hostname
  #
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


  # Keycloak canonical admin path
  location = /admin {
    return 301 /admin/;
  }

  # ----------------------------
  # Keycloak Admin UI
  # ----------------------------
  location /admin/ {
    proxy_http_version 1.1;

    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   8085;

    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    proxy_pass http://keycloak;
  }

  # ----------------------------
  # Keycloak realms
  # ----------------------------
  location /realms/ {
    proxy_http_version 1.1;

    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   8085;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    proxy_pass http://keycloak;
  }

  # ----------------------------
  # Frontend (SPA)
  # ----------------------------
  location / {
    proxy_http_version 1.1;

    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   8085;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    proxy_pass http://frontend;
  }

  # ----------------------------
  # Backend (BFF)
  # ----------------------------
  location /api/ {
    proxy_http_version 1.1;

     # Preserve host:port as seen by the browser (docker port-mapping hides 8085 from nginx)
    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   8085;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    proxy_redirect off;

    proxy_pass http://backend;
  }

  # ----------------------------
  # Backend OAuth endpoints
  # ----------------------------
  location /oauth2/ {
    proxy_http_version 1.1;

    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   8085;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    proxy_pass http://backend;
  }


  location /login/ {
    proxy_http_version 1.1;

    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   8085;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    proxy_pass http://backend;
  }

  # ----------------------------
  # Keycloak static assets
  # ----------------------------
  location ~ ^/(resources|js)/ {
    proxy_http_version 1.1;

    proxy_set_header Host               $http_host;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   8085;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    proxy_pass http://keycloak;
  }
}
