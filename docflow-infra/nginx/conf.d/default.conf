upstream backend {
  server docflow-backend:8080;
}

upstream keycloak {
  server docflow-keycloak:8080;
}

server {
  listen 80;
  absolute_redirect off;
  proxy_redirect off;

  # ----------------------------
  # HSTS (REAL PROD ONLY)
  # ----------------------------
  # ADDED: HSTS must be owned by NGINX when TLS is terminated here.
  # ENABLE ONLY when:
  # - real HTTPS
  # - public domain
  # - stable hostname
  #
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


  # Keycloak canonical admin path
  location = /admin {
    return 301 /admin/;
  }

  # ----------------------------
  # Keycloak Admin UI
  # ----------------------------
  location /admin/ {
    proxy_http_version 1.1;

    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    proxy_pass http://keycloak;
  }

  # ----------------------------
  # Keycloak realms
  # ----------------------------
  location /realms/ {
    proxy_http_version 1.1;

    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    proxy_pass http://keycloak;
  }

  # ----------------------------
  # Backend (BFF)
  # ----------------------------
  location / {
    proxy_http_version 1.1;

    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    proxy_redirect off;

    proxy_pass http://backend;
  }

  # ----------------------------
  # Keycloak static asset paths
  # ----------------------------
  location /resources/ {
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_pass http://keycloak;
  }

  # ----------------------------
  # Keycloak static asset paths
  # ----------------------------
  location /js/ {
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_pass http://keycloak;
  }
}
