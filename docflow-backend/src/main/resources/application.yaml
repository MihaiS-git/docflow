spring:
  application:
    name: docflow-rest-api
  autoconfigure:
    exclude:
      # Disable RabbitMQ auto-configuration until RabbitMQ is added
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid,profile,email,roles
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTH_URI}
            token-uri: ${KEYCLOAK_TOKEN_URI}
            jwk-set-uri: ${KEYCLOAK_JWKS_URI}
            # IMPORTANT:
            # user-info-uri is intentionally REMOVED
            # Spring must NOT call /userinfo (it caused 401 + login failure)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

# Actuator & metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: docflow-rest-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    rabbit:
      enabled: false

# Server settings and session cookie configuration
server:
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

# Custom application properties
docflow:
  security:
    # Comma-separated list of allowed origins for CORS
    allowed-origins: ${DOCFLOW_ALLOWED_ORIGINS}
    keycloak-logout-uri: ${KEYCLOAK_LOGOUT_URI}
    post-logout-redirect-uri: ${DOCFLOW_POST_LOGOUT_REDIRECT}
# Otel configuration to disable tracing
otel:
  traces:
    exporter: none
