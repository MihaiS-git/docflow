spring:
  application:
    name: docflow-rest-api

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            authorization-grant-type: authorization_code
            scope: openid,profile,email,roles
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTH_URI}
            token-uri: ${KEYCLOAK_TOKEN_URI}
            jwk-set-uri: ${KEYCLOAK_JWKS_URI}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: docflow-rest-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    rabbit:
      enabled: false

# Server
server:
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: LAX
      timeout: 30m
  use-forward-headers: true
  forward-headers-strategy: framework
  tomcat:
    use-relative-redirects: true

logging:
  level:
    root: INFO
    com.brutecx: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.keycloak: WARN

docflow:
  bootstrap:
    admin:
      email: ${DOCFLOW_BOOTSTRAP_ADMIN_EMAIL}
      first-name: ${DOCFLOW_BOOTSTRAP_ADMIN_FIRST_NAME}
      last-name: ${DOCFLOW_BOOTSTRAP_ADMIN_LAST_NAME}

  security:
    allowed-origins: ${DOCFLOW_ALLOWED_ORIGINS}
    keycloak-logout-uri: ${KEYCLOAK_LOGOUT_URI}
    post-logout-redirect-uri: ${DOCFLOW_POST_LOGOUT_REDIRECT}
    frontend-base-url: ${FRONTEND_BASE_URL}

    session:
      absolute-timeout: 8h
      max-concurrent-sessions: 1

    keycloak:
      admin:
        enabled: true
        base-url: ${KEYCLOAK_ADMIN_BASE_URL}
        realm: ${KEYCLOAK_REALM}
        client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
        client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
        poll-fixed-delay-ms: ${KEYCLOAK_ADMIN_POLL_DELAY_MS}
        page-size: ${KEYCLOAK_ADMIN_PAGE_SIZE}

  audit:
    canonical:
      version: 1
    chain:
      enabled: true
      secret:
        part-a: ${DOCFLOW_AUDIT_CHAIN_SECRET_PART_A:}
        part-b-path: /run/secrets/audit_chain_part_b
    export:
      signing:
        private-key-pkcs8-pem: ${DOCFLOW_AUDIT_EXPORT_SIGNING_PRIVATE_KEY_PKCS8_PEM:}
        private-key-pkcs8-pem-path: ${DOCFLOW_AUDIT_EXPORT_SIGNING_PRIVATE_KEY_PKCS8_PEM_PATH:}
        key-id: ${DOCFLOW_AUDIT_EXPORT_SIGNING_KEY_ID}