spring:
  application:
    name: docflow rest api
  autoconfigure:
    exclude:
      # Disable DataSource auto-configuration until add Postgres
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      # Disable RabbitMQ auto-configuration until add RabbitMQ
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

#  Actuator & metrics configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: docflow-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Disable RabbitMQ health check
  health:
    rabbit:
      enabled: false
server:
  error:
    include-message: never
    include-stacktrace: never

#  Enable OpenTelemetry (requires Tempo for tracing)
#otel:
#  traces:
#    exporter: otlp
#  exporter:
#    otlp:
#      endpoint: http://tempo:4317
otel:
  traces:
    exporter: none
