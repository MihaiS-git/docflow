spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:docflow-bff}
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://localhost:8085/realms/docflow/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/docflow/protocol/openid-connect/token}
            jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/docflow/protocol/openid-connect/certs}

  datasource:
    url: jdbc:postgresql://localhost:5432/docflowdb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update

  devtools:
    restart:
      enabled: true

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

# CHANGED: dev profile must work over plain HTTP (LAN/dev). OAuth2 state is stored in session cookie.
server:
  servlet:
    session:
      cookie:
        secure: false     # CHANGED: required for HTTP; otherwise browser drops JSESSIONID
        same-site: LAX    # CHANGED: stable dev behavior
      timeout: 30m
  use-forward-headers: true                 # ADDED: align with application-prod.yaml
  forward-headers-strategy: framework       # CHANGED: align with application-prod.yaml
  tomcat:
    use-relative-redirects: true

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR
    org.springframework.transaction.interceptor: TRACE

docflow:
  bootstrap:
  admin:
    email: ${DOCFLOW_BOOTSTRAP_ADMIN_EMAIL:admin@brutecx.test}
    first-name: ${DOCFLOW_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
    last-name: ${DOCFLOW_BOOTSTRAP_ADMIN_LAST_NAME:User}
  security:
    allowed-origins: ${DOCFLOW_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    keycloak-logout-uri: ${KEYCLOAK_LOGOUT_URI:http://localhost:8085/realms/docflow/protocol/openid-connect/logout}
    post-logout-redirect-uri: ${DOCFLOW_POST_LOGOUT_REDIRECT:http://localhost:3000}
    keycloak:
      admin:
        enabled: true
        base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://keycloak:8080}
        realm: ${KEYCLOAK_REALM:docflow}
        client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:docflow-admin-events}
        client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:${KEYCLOAK_ADMIN_CLIENT_SECRET}}
        poll-fixed-delay-ms: ${KEYCLOAK_ADMIN_POLL_DELAY_MS:5000}
        page-size: ${KEYCLOAK_ADMIN_PAGE_SIZE:100}

    # ADDED: align with application-prod.yaml (required by SecurityConfig)
    session:
      absolute-timeout: 8h
      max-concurrent-sessions: 1


