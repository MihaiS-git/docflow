spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/docflow-test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

logging:
  level:
    root: WARN

docflow:
  security:
    frontend-base-url: http://localhost:3000

  audit:
    retention:
      system-actor-user-id: 00000000-0000-0000-0000-000000000001

    export:
      signing:
        master-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="